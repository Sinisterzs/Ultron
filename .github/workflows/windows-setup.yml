name: Windows online setup

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare minimal build tools
        run: python -m pip install "pyinstaller>=6,<7" "PyQt6>=6.6,<7"
      - name: Configure repository and release identity
        shell: pwsh
        env:
          BUILD_REF: ${{ github.ref_name }}
        run: |
          $version = (Get-Content release_config.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:BUILD_REF }
          python installer/configure_release.py --repository "$env:GITHUB_REPOSITORY" --version "$version"
      - name: Build single setup
        shell: pwsh
        run: ./installer/build-online.ps1
      - name: Verify executable icons and isolated setup startup
        shell: pwsh
        run: |
          python installer/verify_icons.py
          $smoke = Join-Path $env:GITHUB_WORKSPACE '.installer-checks/smoke'
          $env:ULTRON_DATA_DIR = Join-Path $env:GITHUB_WORKSPACE '.installer-checks/data'
          $process = Start-Process -FilePath './dist/ULTRON-Setup.exe' -ArgumentList @('--smoke-test', $smoke) -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(120000)) { throw 'Setup smoke test timed out.' }
          if ($process.ExitCode -ne 0) {
            if (Test-Path "$smoke/error.txt") { Get-Content "$smoke/error.txt" }
            throw 'Setup smoke test failed.'
          }
          $report = Get-Content "$smoke/report.json" | ConvertFrom-Json
          if (-not $report.frozen -or -not $report.separate_launcher_verified) { throw 'Incomplete smoke report.' }
      - uses: actions/upload-artifact@v6
        with:
          name: ULTRON-Windows-Setup
          path: |
            dist/ULTRON-Setup.exe
            dist/ULTRON-Setup.exe.sha256
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $notesFile = "docs/releases/$($env:RELEASE_TAG.TrimStart('v')).md"
          $notesArg = if (Test-Path $notesFile) { @('--notes-file', $notesFile) } else { @('--generate-notes') }
          gh release view "$env:RELEASE_TAG" --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'Release exists; uploading assets and ensuring it is public.'
            gh release upload "$env:RELEASE_TAG" dist/ULTRON-Setup.exe dist/ULTRON-Setup.exe.sha256 --clobber
            gh release edit "$env:RELEASE_TAG" --draft=false @notesArg
          } else {
            gh release create "$env:RELEASE_TAG" dist/ULTRON-Setup.exe dist/ULTRON-Setup.exe.sha256 --verify-tag --title "ULTRON $env:RELEASE_TAG" @notesArg
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release.' }
          }
